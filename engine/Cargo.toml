[package]
name = "chaturaji_engine"
version = "0.1.0"
edition = "2021"
description = "Compiled core for the Chaturaji bot: NNUE inference with incremental accumulators"
publish = false

[lib]
name = "chaturaji_engine"
crate-type = ["cdylib", "rlib"]

[features]
# The Python bindings. `cargo test --no-default-features` tests the pure Rust core alone.
default = ["python"]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
rayon = "1.10"
pyo3 = { version = "0.27", optional = true }
numpy = { version = "0.27", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
