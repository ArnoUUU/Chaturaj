[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "chaturaji_engine"
version = "0.1.0"
description = "Compiled core for the Chaturaji bot (NNUE inference)"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.maturin]
features = ["python", "pyo3/extension-module"]
